name: One-time lockfile repair

on:
  push:
    branches: [revamp-static-portfolio]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revamp-static-portfolio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply compatible security updates
        run: npm audit fix
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "Fix vulnerable dependency resolutions"
            git push origin HEAD:revamp-static-portfolio
          fi
