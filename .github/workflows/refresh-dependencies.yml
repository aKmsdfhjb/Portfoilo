name: Refresh portfolio dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update patched Vite and vulnerable transitive packages
        run: |
          npm install --save-dev vite@^7.3.7 --ignore-scripts --no-audit
          npm audit fix --ignore-scripts
      - name: Verify dependency audit and production build
        run: |
          npm audit --audit-level=high
          npm run build
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update patched frontend dependencies"
            git push
          fi
